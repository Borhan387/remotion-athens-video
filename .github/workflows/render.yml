
name: Render Remotion Video

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Render video
        run: npx remotion render src/index.ts AthensOnFire out/AthensOnFire.mp4

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: AthensOnFire-MP4
          path: out/AthensOnFire.mp4
          if-no-files-found: error
          retention-days: 7

